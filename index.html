<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bloquitos</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--teal:#22a99a;--teal-d:#17867a;--cream:#fdf3e1;--ink:#3a3550;--panel:#fff;--line:#eadfca}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:Nunito,system-ui,sans-serif;background:var(--cream);color:var(--ink);display:flex;flex-direction:column;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--teal);color:#fff;box-shadow:0 3px 0 var(--teal-d);z-index:2}
.logo{display:grid;grid-template-columns:repeat(2,12px);gap:3px}
.logo i{width:12px;height:12px;border-radius:4px;display:block}
header h1{font:800 26px/1 'Baloo 2',Nunito,sans-serif;margin:0;letter-spacing:.5px}
.sp{flex:1}
.hbtn{border:none;background:rgba(255,255,255,.2);color:#fff;font:800 14px Nunito,sans-serif;padding:8px 14px;border-radius:999px;cursor:pointer}
.hbtn:hover{background:rgba(255,255,255,.32)}
.rdbtn{display:flex;align-items:center;gap:6px}
.rdbtn .w1,.rdbtn .w2{opacity:.35}
.rdbtn[aria-pressed="true"]{background:#fff;color:var(--teal-d)}
.rdbtn[aria-pressed="true"] .w1,.rdbtn[aria-pressed="true"] .w2{opacity:1}
.reading{outline:3px solid #ffd23f!important;outline-offset:3px;border-radius:12px}
.rdtip{position:fixed;right:14px;top:58px;background:var(--ink);color:#fff;font:800 14px Nunito,sans-serif;padding:8px 14px;border-radius:12px;max-width:min(420px,80vw);z-index:90;pointer-events:none;opacity:0;transform:translateY(-6px);transition:.15s}
.rdtip.on{opacity:1;transform:none}
@media (max-width:640px){.rdbtn span{display:none}.hbtn{padding:8px 10px;font-size:12px}}
.top{display:flex;gap:10px;padding:10px 10px 6px;flex:0 0 auto;min-height:0}
.sprites{width:104px;flex:0 0 auto;background:var(--panel);border-radius:18px;box-shadow:0 3px 0 var(--line);display:flex;flex-direction:column;padding:10px 8px;gap:10px;overflow:auto}
.sthumb{position:relative;border-radius:14px;background:#f6f1e7;padding:6px 4px 4px;text-align:center;cursor:pointer;border:3px solid transparent;flex:0 0 auto}
.sthumb img{width:56px;height:56px;display:block;margin:0 auto;pointer-events:none}
.sthumb span{font-size:12px;font-weight:800;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sthumb.sel{border-color:var(--teal);background:#e3f6f3}
.sthumb .x{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;border:2px solid #fff;background:#e95656;color:#fff;font:800 11px/18px Nunito,sans-serif;cursor:pointer;display:none;padding:0}
.sthumb.sel .x{display:block}
.sthumb .x.ed{right:auto;left:-7px;background:#4C9BE8}
.addbtn{border:3px dashed #cfc3ab;background:none;border-radius:14px;font:800 28px/1 Nunito,sans-serif;color:#b3a585;padding:10px 0;cursor:pointer;flex:0 0 auto}
.addbtn:hover{border-color:var(--teal);color:var(--teal)}
.stagecol{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.sbar{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.cbtn{width:44px;height:44px;border-radius:14px;border:none;cursor:pointer;display:grid;place-items:center;background:#fff;box-shadow:0 3px 0 var(--line);color:var(--ink);padding:0}
.cbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.cbtn.go{background:#3fbf5f;box-shadow:0 3px 0 #2c9446}
.cbtn.halt{background:#e95656;box-shadow:0 3px 0 #b83a3a}
.cbtn.on{background:#e3f6f3;outline:3px solid var(--teal)}
.go.running{animation:pulse 1s infinite}
@keyframes pulse{50%{filter:brightness(1.2);transform:scale(1.07)}}
.gap{width:10px}
.stagewrap{position:relative;border-radius:16px;overflow:hidden;box-shadow:0 0 0 4px #fff,0 7px 0 4px var(--line);background:#fff;flex:0 0 auto}
.stage{position:absolute;left:0;top:0;width:480px;height:360px;transform-origin:0 0;overflow:hidden}
.stage .bg,.stage .grid,#sprl{position:absolute;inset:0}
.stage .bg svg{display:block}
.stage .grid{display:none;background-image:linear-gradient(rgba(0,0,0,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.13) 1px,transparent 1px);background-size:24px 24px;pointer-events:none}
.stage.showgrid .grid{display:block}
.spr{position:absolute;left:0;top:0;width:0;height:0}
.spr .body{position:absolute;left:-40px;top:-40px;width:80px;height:80px;cursor:grab;touch-action:none;transition:opacity .2s}
.spr .body img{width:100%;height:100%;pointer-events:none;-webkit-user-drag:none}
.spr.cur .body img{filter:drop-shadow(0 0 3px #fff) drop-shadow(0 0 4px rgba(34,169,154,.9))}
.bubble{position:absolute;left:0;transform:translateX(-50%) scale(.5);transform-origin:50% 100%;opacity:0;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:5px 12px;font:800 15px Nunito,sans-serif;white-space:nowrap;pointer-events:none;transition:transform .15s,opacity .15s;z-index:5}
.bubble::after{content:'';position:absolute;left:50%;bottom:-12px;margin-left:-8px;border:8px solid transparent;border-top-color:var(--ink)}
.bubble.on{opacity:1;transform:translateX(-50%) scale(1)}
.bottom{flex:1;min-height:210px;display:flex;flex-direction:column;margin:4px 10px 10px;background:var(--panel);border-radius:18px;box-shadow:0 3px 0 var(--line);overflow:hidden}
.palbar{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--tint,#fff6d6);transition:background .2s}
.cats{display:grid;grid-template-columns:repeat(4,32px);gap:6px;flex:0 0 auto}
.cat{width:32px;height:32px;border-radius:50%;border:3px solid #fff;cursor:pointer;display:grid;place-items:center;color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15);padding:0}
.cat.sel{transform:scale(1.15);box-shadow:0 0 0 3px var(--ink)}
.palette{display:flex;gap:14px;overflow-x:auto;align-items:center;padding:6px 14px 8px 6px;flex:1;min-height:84px}
.area{flex:1;overflow:auto;position:relative;background-color:#fbf8f2;background-image:radial-gradient(#e2d8c4 1.4px,transparent 1.4px);background-size:22px 22px}
.canvas{position:relative;min-width:1600px;min-height:520px}
.hint{position:absolute;left:24px;top:24px;color:#b9ab8d;font-weight:800;font-size:15px;pointer-events:none}
.chain{position:absolute;display:flex;align-items:center;gap:0}
.chain.live>.blk:first-child>.shape{filter:drop-shadow(0 4px 0 rgba(0,0,0,.2)) drop-shadow(0 0 6px #fff) drop-shadow(0 0 10px var(--c))}
.blk{position:relative;width:64px;height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding-left:7px;color:#fff;flex:0 0 auto;cursor:grab;touch-action:none;transition:transform .1s,filter .1s}
.blk>*:not(.shape){position:relative;z-index:1}
.blk>.shape{position:absolute;left:0;top:0;overflow:visible;z-index:0;pointer-events:none;filter:drop-shadow(0 4px 0 rgba(0,0,0,.2))}
.blk.hat{padding-left:4px}
.palette .blk{touch-action:pan-x}
.palette{gap:22px!important}
.blk.run{filter:brightness(1.2);transform:translateY(-4px)}
.blk.snap{outline:3px dashed var(--ink);outline-offset:3px}
.blk svg{display:block}
.ic{display:grid;place-items:center}
.emo{font-size:25px;line-height:1}
.pill{background:#fff;color:var(--ink);border-radius:7px;font:800 13px/18px Nunito,sans-serif;height:18px;min-width:24px;padding:0 4px;text-align:center;border:none;outline:none}
span.pill.txt{max-width:54px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
input.pill{width:34px;-webkit-user-select:text;user-select:text}
input.pill.txt{width:56px}
input.pill:focus{box-shadow:0 0 0 2px var(--ink)}
.dot{width:18px;height:18px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 0 rgba(0,0,0,.25)}
.cyc{cursor:pointer}
.blk.rep{width:auto;height:auto;min-height:62px;flex-direction:row;padding:6px 10px 6px 12px;gap:6px}
.rep-head{display:flex;flex-direction:column;align-items:center;gap:2px;width:46px}
.rep-inner{display:flex;align-items:center;gap:0;min-width:64px;min-height:68px;padding:2px 18px 2px 6px;background:rgba(255,255,255,.35);border:2px dashed rgba(255,255,255,.85);border-radius:10px}
.palette .rep-inner{min-width:30px;min-height:42px;padding:0}
.ghost{position:fixed!important;left:0;top:0;pointer-events:none;z-index:60;filter:drop-shadow(0 8px 10px rgba(0,0,0,.25))}
.modal{position:fixed;inset:0;background:rgba(40,35,60,.45);display:none;align-items:center;justify-content:center;z-index:80;padding:16px}
.modal.on{display:flex}
.sheet{background:#fff;border-radius:22px;padding:18px;max-width:640px;width:100%;max-height:90vh;overflow:auto;position:relative;box-shadow:0 6px 0 var(--line)}
.sheet h2{margin:0 0 12px;font:800 22px 'Baloo 2',Nunito,sans-serif}
.close{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:none;background:#f1ebdf;font:800 15px Nunito,sans-serif;cursor:pointer;color:var(--ink)}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.pick button{border:3px solid #eee6d6;border-radius:16px;background:#faf7f0;padding:8px;cursor:pointer;font:800 13px Nunito,sans-serif;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:4px}
.pick button:hover,.pick button.sel{border-color:var(--teal)}
.pick img{width:72px;height:72px}
.pick.bgs{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.pick .bgt{width:100%;aspect-ratio:4/3;border-radius:10px;overflow:hidden}
.pick .bgt svg{width:100%;height:100%;display:block}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.actions button{border:none;border-radius:999px;padding:10px 18px;font:800 14px Nunito,sans-serif;cursor:pointer;background:#f1ebdf;color:var(--ink)}
.actions .primary{background:#e95656;color:#fff}
.rcol{display:flex;flex-direction:column;gap:10px;width:118px;flex:0 0 auto;min-height:0}
.rcol .pages{width:auto!important;flex:1 1 auto;min-height:90px}
.mbsim{background:var(--panel);border-radius:18px;box-shadow:0 3px 0 var(--line);padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;flex:0 0 auto}
.mbsim[hidden]{display:none}
.mbboard{background:#2c2f3a;border-radius:12px;padding:8px 4px;display:flex;align-items:center;gap:4px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.4)}
.mbgrid{display:grid;grid-template-columns:repeat(5,8px);gap:2px}
.mbgrid i{width:8px;height:8px;border-radius:2px;background:#4a4d5a;display:block;transition:background .08s}
.mbgrid i.on{background:#ff3b3b;box-shadow:0 0 5px #ff3b3b}
.mbbtn{width:18px;height:18px;border-radius:50%;border:2px solid #9a9a9a;background:#111;color:#fff;font:800 9px/14px Nunito,sans-serif;cursor:pointer;padding:0}
.mbbtn:active{background:#555}
.mblab{font:800 12px Nunito,sans-serif}
.mbexp{border:none;background:#1aa3c8;color:#fff;font:800 11px Nunito,sans-serif;border-radius:999px;padding:6px 9px;cursor:pointer}
.extbtn{width:32px;height:32px;border-radius:50%;border:3px dashed #b3a585;background:#fff;cursor:pointer;display:grid;place-items:center;padding:0;color:#8a7c5c}
.extcard{display:flex;gap:14px;align-items:center;border:3px solid #eee6d6;border-radius:16px;padding:14px;background:#faf7f0}
.extcard p{margin:4px 0 0;font-weight:600;font-size:14px}
.extcard button{margin-left:auto;border:none;border-radius:999px;padding:10px 16px;font:800 14px Nunito,sans-serif;cursor:pointer;background:var(--teal);color:#fff;flex:0 0 auto}
.extcard button.off{background:#e95656}
.steps{margin:10px 0 0;padding-left:20px;font-weight:600;line-height:1.6}
.lnk{color:#1278a0;font-weight:800;text-decoration:underline;text-underline-offset:2px}
.lnk:hover{color:#0b5674}
.pages{width:118px;flex:0 0 auto;background:var(--panel);border-radius:18px;box-shadow:0 3px 0 var(--line);display:flex;flex-direction:column;padding:10px 8px;gap:10px;overflow:auto;align-items:center}
.pthumb{position:relative;width:96px;height:72px;border-radius:10px;overflow:hidden;border:3px solid #e6dcc8;cursor:pointer;flex:0 0 auto;background:#fff}
.pthumb.sel{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal)}
.pthumb .pin{position:absolute;left:0;top:0;width:480px;height:360px;transform:scale(.19);transform-origin:0 0;pointer-events:none}
.pthumb .pin img{position:absolute;width:80px;height:80px}
.pthumb .n{position:absolute;left:4px;bottom:3px;background:var(--ink);color:#fff;font:800 11px/18px Nunito,sans-serif;width:18px;height:18px;border-radius:50%;text-align:center}
.pthumb .x{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;border:2px solid #fff;background:#e95656;color:#fff;font:800 10px/16px Nunito,sans-serif;cursor:pointer;display:none;padding:0}
.pthumb.sel .x{display:block}
.pages .addbtn{width:96px;padding:6px 0}
#txl{position:absolute;inset:0}
.stxt{position:absolute;transform:translate(-50%,-50%);font-family:'Baloo 2',Nunito,sans-serif;font-weight:800;white-space:nowrap;cursor:grab;touch-action:none;line-height:1.1;text-shadow:0 2px 0 rgba(255,255,255,.6)}
.glab{position:absolute;font:800 9px Nunito,sans-serif;color:rgba(0,0,0,.45)}
.micbtn{flex:0 0 auto;width:62px;height:62px;border-radius:14px;border:3px dashed #3DB86A;background:#fff;color:#3DB86A;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 11px Nunito,sans-serif;padding:0}
.recdot{width:90px;height:90px;border-radius:50%;margin:10px auto;background:#e95656;display:grid;place-items:center;color:#fff;font:800 22px Nunito,sans-serif}
.recdot.on{animation:pulse 1s infinite}
.paint{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.paint canvas{width:300px;height:300px;max-width:72vw;max-height:72vw;border-radius:14px;touch-action:none;cursor:crosshair;background:repeating-conic-gradient(#f1ebdf 0 25%,#fff 0 50%) 0 0/20px 20px;border:3px solid #e6dcc8}
.ptools{display:flex;flex-direction:column;gap:10px;min-width:180px}
.prow{display:flex;flex-wrap:wrap;gap:6px}
.prow button{border:3px solid #eee6d6;background:#faf7f0;border-radius:12px;min-width:40px;height:40px;cursor:pointer;font:800 13px Nunito,sans-serif;color:var(--ink);padding:0 8px}
.prow button.sel{border-color:var(--teal);background:#e3f6f3}
.prow .sw{width:30px;min-width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #e6dcc8;padding:0}
.prow .sw.sel{box-shadow:0 0 0 3px var(--ink)}
.ptools input[type=text]{border:3px solid #eee6d6;border-radius:12px;padding:8px 10px;font:800 14px Nunito,sans-serif;color:var(--ink);width:100%;-webkit-user-select:text;user-select:text}
body.present .pages{display:none}
body.present{background:#2d2a40}
body.present header,body.present .sprites,body.present .bottom,body.present .tool{display:none}
body.present .top{flex:1;align-items:center;justify-content:center}
@media (max-width:640px){
 .top{flex-direction:column}
 .sprites{width:auto;flex-direction:row;overflow-x:auto;padding:8px}
 .sthumb{width:76px}
 .pages{width:auto;flex-direction:row;overflow-x:auto;padding:8px}
 .pages .addbtn{width:60px;height:72px}
 .sthumb img{width:44px;height:44px}
 .addbtn{padding:0 16px}
 header h1{font-size:21px}
 .cats{grid-template-columns:repeat(4,30px)}
 .rcol{width:auto;flex-direction:row}
 .rcol .pages{flex:1}
 .cat{width:30px;height:30px}
}
</style>
</head>
<body>
<header>
 <div class="logo"><i style="background:#F5B82E"></i><i style="background:#4C9BE8"></i><i style="background:#3DB86A"></i><i style="background:#E95656"></i></div>
 <h1>Bloquitos</h1>
 <div class="sp"></div>
 <button class="hbtn" id="btnOpen" title="Abrir un proyecto guardado">📂 Abrir</button>
 <button class="hbtn" id="btnSave" title="Guardar el proyecto en un archivo">💾 Guardar</button>
 <input type="file" id="fileIn" accept=".bloquitos,.json,application/json" hidden>
 <button class="hbtn" id="btnNew">✨ Nuevo proyecto</button>
 <button class="hbtn rdbtn" id="btnReader" aria-pressed="false" title="Lector de pantalla: lee en voz alta lo que tocás"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path class="w1" d="M16.5 8.5a5 5 0 0 1 0 7"/><path class="w2" d="M19.5 5.5a9 9 0 0 1 0 13"/></svg><span>Lector</span></button>
</header>

<div class="top">
 <div class="sprites" id="sprites"></div>
 <div class="stagecol">
  <div class="sbar">
   <button class="cbtn go" id="btnGo" title="Bandera verde: ¡a jugar!"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V4"/><path d="M6 4h12l-3 4 3 4H6z" fill="#fff"/></svg></button>
   <button class="cbtn halt" id="btnStop" title="Detener todo"><svg viewBox="0 0 24 24" width="22" height="22"><rect x="5" y="5" width="14" height="14" rx="3" fill="#fff"/></svg></button>
   <span class="gap tool"></span>
   <button class="cbtn tool" id="btnReset" title="Volver todos los personajes a su lugar de inicio"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
   <button class="cbtn tool" id="btnText" title="Agregar texto"><b style="font:800 18px 'Baloo 2',Nunito,sans-serif">Aa</b></button>
   <button class="cbtn tool" id="btnGrid" title="Cuadrícula"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg></button>
   <button class="cbtn tool" id="btnBg" title="Elegir fondo"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 16l5-5 4 4 3-3 6 6"/><circle cx="16" cy="9" r="1.8"/></svg></button>
   <button class="cbtn" id="btnFull" title="Pantalla completa"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
  <div class="stagewrap" id="stagewrap">
   <div class="stage" id="stage"><div class="bg" id="bg"></div><div id="txl"></div><div id="sprl"></div><div class="grid" id="grid"></div></div>
  </div>
 </div>
 <div class="rcol">
  <div class="pages" id="pages"></div>
  <div class="mbsim" id="mbsim" hidden>
   <div class="mbboard">
    <button class="mbbtn" id="mbA" title="Botón A de la micro:bit">A</button>
    <div class="mbgrid" id="mbgrid" aria-label="Pantalla de la micro:bit"></div>
    <button class="mbbtn" id="mbB" title="Botón B de la micro:bit">B</button>
   </div>
   <div class="mblab">micro:bit</div>
   <button class="mbexp" id="mbExport" title="Descargar el programa para la micro:bit (MicroPython)">⬇ Descargar .py</button>
  </div>
 </div>
</div>

<div class="bottom">
 <div class="palbar" id="palbar"><div class="cats" id="cats"></div><div class="palette" id="palette"></div></div>
 <div class="area" id="area"><div class="canvas" id="canvas"></div></div>
</div>

<div class="modal" id="modal"><div class="sheet"><button class="close" id="mclose" aria-label="Cerrar">✕</button><h2 id="mtitle"></h2><div id="mbody"></div></div></div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const W=480,H=360,CELL=24,KEY='bloquitos-v1';
const SPD=[260,130,50]; // ms por casillero: lento, normal, rápido
const MSG=['#ff5c5c','#3fa9f5','#3fbf5f','#ffd23f','#b07ce8','#ff9f1c'];

function load(){
 try{const s=localStorage.getItem(KEY);if(s)P=JSON.parse(s)}catch(e){P=null}

}
function normalize(){
 if(P&&Array.isArray(P.sprites))P={pi:0,sounds:[],pages:[{id:uid(),bg:P.bg,sprites:P.sprites,texts:[]}]};
 if(!P||!Array.isArray(P.pages)||!P.pages.length)P=defaultProject();
 P.ext=P.ext||{};P.sounds=P.sounds||[];P.pi=Math.min(P.pi||0,P.pages.length-1);
 P.pages.forEach(p=>{p.id=p.id||uid();p.texts=p.texts||[];p.sprites=p.sprites||[];if(!BGS[p.bg])p.bg='pradera';
 p.sprites.forEach(s=>{if(!s.img&&!CHARS[s.kind])s.kind='robot';s.size=s.size||1;s.rot=s.rot||0;s.speed=s.speed??1;s.visible=s.visible!==false;s.hx=s.hx??s.x;s.hy=s.hy??s.y;s.scripts=s.scripts||[]})});
 curId=pg().sprites[0]&&pg().sprites[0].id;
}

function makeBlockEl(b,live){
 const d=DEFS[b.type],cat=CATMAP[d.cat];
 const el=document.createElement('div');
 el.className='blk'+(d.hat?' hat':'')+(d.tail?' tail':'')+(d.wrap?' rep':'');

 if(d.wrap){
  const head=document.createElement('div');head.className='rep-head';head.innerHTML=icon;addParam(head,b,live);el.appendChild(head);
  const inner=document.createElement('div');inner.className='rep-inner';inner.dataset.rep=b.id;
  (b.inner||[]).forEach(c=>inner.appendChild(makeBlockEl(c,live)));el.appendChild(inner);
 }else{el.innerHTML=icon;addParam(el,b,live)}
 const NS='http://www.w3.org/2000/svg',sv=document.createElementNS(NS,'svg'),pa=document.createElementNS(NS,'path');
 sv.setAttribute('class','shape');pa.setAttribute('fill',cat.color);sv.appendChild(pa);el.prepend(sv);

/* Forma de pieza de rompecabezas: muesca a la izquierda, lengüeta a la derecha */
const BW=64,BH=62;
function shapePath(w,h,hat,tail){
 const r=10,m=h/2,n=9,R=Math.min(28,h/2);
 let d=hat?`M${R},0`:`M${r},0`;
 d+=tail?`H${w-R}A${R},${R} 0 0 1 ${w},${R}V${h-R}A${R},${R} 0 0 1 ${w-R},${h}`
        :`H${w-r}Q${w},0 ${w},${r}V${m-n}C${w+13},${m-n-4} ${w+13},${m+n+4} ${w},${m+n}V${h-r}Q${w},${h} ${w-r},${h}`;
 d+=hat?`H${R}A${R},${R} 0 0 1 0,${h-R}V${R}A${R},${R} 0 0 1 ${R},0Z`
       :`H${r}Q0,${h} 0,${h-r}V${m+n}C13,${m+n+4} 13,${m-n-4} 0,${m-n}V${r}Q0,0 ${r},0Z`;
 return d;
}
function fixShapes(root){

 reps.forEach(el=>{const w=el.offsetWidth,h=el.offsetHeight,sv=el.querySelector(':scope>.shape');if(!sv)return;sv.setAttribute('width',w);sv.setAttribute('height',h);sv.firstChild.setAttribute('d',shapePath(w,h,false,false))});

/* ---------- Arrastrar y soltar ---------- */
let D=null;
function track(e,h){
 const sx=e.clientX,sy=e.clientY;let drag=false;
 const mv=ev=>{if(!drag&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>6){drag=true;h.start(ev)}if(drag)h.move(ev)};
 const up=ev=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);if(drag)h.drop(ev);else if(ev.type==='pointerup')h.tap(ev)};
 addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up);
}
function beginDrag(chain,off,ev){
 const g=document.createElement('div');g.className='chain ghost';
 chain.forEach(b=>g.appendChild(makeBlockEl(b,false)));
 document.body.appendChild(g);fixShapes(g);D={chain,off,g,best:null,snapEl:null,inArea:false};dragMove(ev);
}
function dragMove(ev){
 if(!D)return;
 D.g.style.transform=`translate(${ev.clientX-D.off.x}px,${ev.clientY-D.off.y}px)`;
 const best=findDrop(ev);
 if(D.snapEl)D.snapEl.classList.remove('snap');
 D.best=best;D.snapEl=best&&best.el;if(D.snapEl)D.snapEl.classList.add('snap');
}
function canPlace(chain,best){
 const hat=!!DEFS[chain[0].type].hat,tail=!!DEFS[chain[chain.length-1].type].tail;
 if(best.kind==='after'){const loc=findLoc(best.id);if(!loc)return false;if(hat||DEFS[loc.arr[loc.idx].type].tail)return false;if(tail&&!(loc.top&&loc.idx===loc.arr.length-1))return false;return true}
 if(best.kind==='in')return!hat&&!tail;
 if(best.kind==='before'){const sc=cur().scripts.find(s=>s.id===best.sid);return!!sc&&!tail&&!DEFS[sc.blocks[0].type].hat}
 return false;
}
function findDrop(ev){
 const ar=area.getBoundingClientRect();
 D.inArea=ev.clientX>=ar.left&&ev.clientX<=ar.right&&ev.clientY>=ar.top&&ev.clientY<=ar.bottom;
 if(!D.inArea||!cur())return null;
 const f=D.g.firstElementChild.getBoundingClientRect(),l=D.g.lastElementChild.getBoundingClientRect();
 const gl=f.left,gy=f.top+f.height/2;let best=null,bd=36;
 const consider=(c,d)=>{if(d<bd&&canPlace(D.chain,c)){bd=d;best=c}};
 canvas.querySelectorAll('.blk').forEach(el=>{const r=el.getBoundingClientRect();if(gy<r.top-14||gy>r.bottom+14)return;consider({kind:'after',id:el.dataset.id,el},Math.abs(gl-r.right)+Math.abs(gy-(r.top+r.height/2))*.3)});
 canvas.querySelectorAll('.rep-inner').forEach(el=>{const r=el.getBoundingClientRect();if(gy<r.top||gy>r.bottom)return;consider({kind:'in',id:el.dataset.rep,el:el.parentElement},Math.abs(gl-r.left-6))});
 canvas.querySelectorAll('.chain').forEach(el=>{const f0=el.firstElementChild;if(!f0)return;const r=f0.getBoundingClientRect();if(gy<r.top-14||gy>r.bottom+14)return;consider({kind:'before',sid:el.dataset.sid,el:f0},Math.abs(l.right-r.left))});
 return best;
}
function dragDrop(ev){
 if(!D)return;dragMove(ev);
 const{chain,g,best,inArea}=D;
 if(D.snapEl)D.snapEl.classList.remove('snap');
 if(inArea&&cur()){
  const cr=canvas.getBoundingClientRect(),gr=g.getBoundingClientRect();
  place(chain,best,{x:Math.max(4,Math.round(gr.left-cr.left)),y:Math.max(4,Math.round(gr.top-cr.top))});
 }
 g.remove();D=null;renderScripts();save();
}
function place(chain,best,pos){
 const sp=cur();
 if(best){
  if(best.kind==='after'){const loc=findLoc(best.id);loc.arr.splice(loc.idx+1,0,...chain);return}
  if(best.kind==='in'){const loc=findLoc(best.id);loc.arr[loc.idx].inner.unshift(...chain);return}
  if(best.kind==='before'){const sc=sp.scripts.find(s=>s.id===best.sid);sc.blocks.unshift(...chain);sc.x=pos.x;return}
 }
 sp.scripts.push({id:uid(),x:pos.x,y:pos.y,blocks:chain});
}

/* ---------- Intérprete ---------- */
const nextFrame=()=>new Promise(r=>requestAnimationFrame(r));
function anim(t,dur,step){
 return new Promise(res=>{
  if(dur<=0){step(1);return res()}
  const t0=performance.now();
  const f=now=>{if(!t.alive)return res();const k=Math.min(1,(now-t0)/dur);step(k);k<1?requestAnimationFrame(f):res()};
  requestAnimationFrame(f);
 });
}
const sleep=(t,ms)=>anim(t,ms,()=>{});
function hl(id,on){const el=canvas.querySelector(`.blk[data-id="${id}"]`);if(el)el.classList.toggle('run',on)}
function refreshRun(){
 $('#btnGo').classList.toggle('running',threads.size>0);
 const live=new Set([...threads].map(t=>t.script&&t.script.id));
 canvas.querySelectorAll('.chain').forEach(c=>c.classList.toggle('live',live.has(c.dataset.sid)));
 pg().sprites.forEach(placeEl);
}
function startScript(sp,sc,blocks){
 if(sc)threads.forEach(t=>{if(t.script===sc)t.alive=false});
 const t={sp,script:sc,alive:true};threads.add(t);refreshRun();
 (async()=>{
  try{while(t.alive){const r=await runSeq(t,blocks||sc.blocks);if(r!=='forever')break;await nextFrame()}}
  catch(err){console.error(err)}
  finally{t.alive=false;threads.delete(t);const el=spriteEls[sp.id];if(el&&![...threads].some(x=>x.sp===sp))el.lastElementChild.classList.remove('on');refreshRun()}
 })();
}
async function runSeq(t,seq){
 for(const b of seq){
  if(!t.alive)return'dead';
  const d=DEFS[b.type];if(d.hat)continue;
  hl(b.id,true);
  if(b.type==='repeat'){
   const n=Math.max(0,Math.floor(num(b.val)));
   if(b.inner&&b.inner.length)for(let i=0;i<n&&t.alive;i++){await runSeq(t,b.inner);await nextFrame()}
  }else if(b.type==='forever'){hl(b.id,false);return'forever'}
  else if(b.type==='end'){hl(b.id,false);return'end'}
  else await exec(t,b);
  hl(b.id,false);
 }
 return'done';
}
async function move(t,dx,dy){
 const sp=t.sp,x0=sp.x,y0=sp.y,cells=Math.hypot(dx,dy)/CELL;
 await anim(t,cells*SPD[sp.speed],k=>{sp.x=wrap(x0+dx*k,W);sp.y=wrap(y0+dy*k,H);placeEl(sp)});
}
async function exec(t,b){
 const sp=t.sp,v=b.val;
 switch(b.type){
  case'right':return move(t,num(v)*CELL,0);
  case'left':return move(t,-num(v)*CELL,0);
  case'up':return move(t,0,-num(v)*CELL);
  case'down':return move(t,0,num(v)*CELL);
  case'turnR':case'turnL':{const deg=num(v)*30*(b.type==='turnR'?1:-1),r0=sp.rot;await anim(t,Math.abs(deg)/30*SPD[sp.speed]*.8,k=>{sp.rot=r0+deg*k;placeEl(sp)});sp.rot=wrap(sp.rot,360);placeEl(sp);return}
  case'hop':{const y0=sp.y,h=num(v)*CELL;await anim(t,SPD[sp.speed]*3+120,k=>{sp.y=y0-h*4*k*(1-k);placeEl(sp)});sp.y=y0;placeEl(sp);return}
  case'home':sp.x=sp.hx;sp.y=sp.hy;placeEl(sp);return sleep(t,120);
  case'say':{const el=spriteEls[sp.id];if(!el)return;const bub=el.lastElementChild,txt=String(v??'');bub.textContent=txt;bub.classList.add('on');if(READER.on)READER.say(sp.name+' dice: '+txt);await sleep(t,Math.max(1500,txt.length*90));bub.classList.remove('on');return}
  case'grow':case'shrink':case'size0':{const s0=sp.size,target=b.type==='size0'?1:Math.max(.25,Math.min(4,s0+(b.type==='grow'?1:-1)*num(v)*.1));await anim(t,200,k=>{sp.size=s0+(target-s0)*k;placeEl(sp)});return}
  case'hide':case'show':sp.visible=b.type==='show';placeEl(sp);return sleep(t,220);
  case'pop':SFX.pop();return sleep(t,160);
  case'drum':SFX.drum();return sleep(t,260);
  case'bell':SFX.bell();return sleep(t,600);
  case'note':SFX.note(num(v));return sleep(t,420);
  case'wait':return sleep(t,Math.max(0,num(v))*100);
  case'stop':threads.forEach(x=>{if(x.sp===sp&&x!==t)x.alive=false});return;
  case'speed':sp.speed=Math.max(0,Math.min(2,num(v)));return;
  case'send':fire('recv',null,num(v));return nextFrame();
  case'mbIcon':MB.show((MBI[num(v)]||MBI[0]).p);return sleep(t,400);
  case'mbNum':{const s=String(Math.round(num(v)));if(s.length===1){MB.show(digitPat(s));return sleep(t,400)}for(const ch of s){if(!t.alive)return;MB.show(digitPat(ch));await sleep(t,450);MB.clear();await sleep(t,90)}return}
  case'mbClear':MB.clear();return nextFrame();
  case'mbNote':SFX.note(num(v));return sleep(t,420);
  case'rec':{const s=P.sounds[num(v)];if(!s)return;await new Promise(res=>{const a=new Audio(s.url);let done=false;const fin=()=>{if(!done){done=true;res()}};a.onended=fin;a.onerror=fin;a.play().catch(fin);const chk=()=>{if(!t.alive){a.pause();fin()}else if(!done)setTimeout(chk,100)};chk()});return}
  case'page':{const n=Math.round(num(v))-1;if(n>=0&&n<P.pages.length){setTimeout(()=>{goPage(n);touching=currentOverlaps();fire('flag')},0);t.alive=false}return}
 }
}
function fire(type,onlySp,color){
 pg().sprites.forEach(sp=>{
  if(onlySp&&sp!==onlySp)return;
  sp.scripts.forEach(sc=>{const f=sc.blocks[0];if(f&&f.type===type&&(color==null||num(f.val)===color))startScript(sp,sc)});
 });
}
const overlaps=(a,b)=>a.visible&&b.visible&&Math.hypot(a.x-b.x,a.y-b.y)<30*(a.size+b.size);
function currentOverlaps(){const s=new Set(),A=pg().sprites;for(let i=0;i<A.length;i++)for(let j=i+1;j<A.length;j++)if(overlaps(A[i],A[j]))s.add(A[i].id+'|'+A[j].id);return s}
function tick(){
 if(threads.size){
  const A=pg().sprites;
  for(let i=0;i<A.length;i++)for(let j=i+1;j<A.length;j++){
   const k=A[i].id+'|'+A[j].id;
   if(overlaps(A[i],A[j])){if(!touching.has(k)){touching.add(k);fire('bump',A[i]);fire('bump',A[j])}}
   else touching.delete(k);
  }
 }
 requestAnimationFrame(tick);
}

 threads.forEach(t=>t.alive=false);threads.clear();

const PCOL=['#3a3550','#ffffff','#e95656','#ff9f1c','#ffd23f','#6fd08c','#2f8a4b','#4C9BE8','#7ec8ff','#A06CDB','#f7a1c4','#8d5a3b'];
function flood(cx,x,y,hex){
 const w=400,h=400,img=cx.getImageData(0,0,w,h),d=img.data,i0=(y*w+x)*4,t=[d[i0],d[i0+1],d[i0+2],d[i0+3]];
 const c=[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16),255];
 if(t.every((v,k)=>Math.abs(v-c[k])<4))return;
 const same=i=>Math.abs(d[i]-t[0])<48&&Math.abs(d[i+1]-t[1])<48&&Math.abs(d[i+2]-t[2])<48&&Math.abs(d[i+3]-t[3])<48;
 const seen=new Uint8Array(w*h),stack=[y*w+x];
 while(stack.length){const p=stack.pop();if(seen[p])continue;seen[p]=1;const i=p*4;if(!same(i))continue;d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2];d[i+3]=255;const px=p%w;if(px>0)stack.push(p-1);if(px<w-1)stack.push(p+1);if(p>=w)stack.push(p-w);if(p<w*h-w)stack.push(p+w)}
 cx.putImageData(img,0,0);
}

  <div class="prow"><button id="pUndo">↶ Deshacer</button><button id="pClear">🗑️ Borrar todo</button></div>
 </div></div><div class="actions"><button id="pCancel">Cancelar</button><button class="primary" id="pOk" style="background:var(--teal)">Listo</button></div>`);

  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  cx.lineCap='round';cx.lineJoin='round';cx.lineWidth=size;cx.strokeStyle=color;
  cx.globalCompositeOperation=tool==='erase'?'destination-out':'source-over';

 };

 $('#pUndo').onclick=()=>{const h=hist.pop();if(h)cx.putImageData(h,0,0)};

async function startRec(){

 try{
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  const mr=new MediaRecorder(stream),chunks=[],st={mr,stream,cancel:false};recState=st;
  mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  mr.onstop=()=>{stream.getTracks().forEach(t=>t.stop());if(recState===st)recState=null;if(st.cancel||!chunks.length)return;

  mr.start();st.timer=setTimeout(()=>stopRec(false),5000);
  const dot=$('#rDot');dot.classList.add('on');dot.textContent='■';msg.textContent='Grabando… tocá de nuevo para terminar.';
 }catch(err){msg.textContent='No se pudo usar el micrófono. Revisá que el navegador tenga permiso.'}

function labelFor(t){

function download(text,name,type){
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;
 document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
}
function exportPy(){
 const NOTE=['C4','D4','E4','F4','G4','A4','B4','C5'];
 const conv=(seq,ind)=>{
  const out=[],I=' '.repeat(ind);
  for(const b of seq){
   const d=DEFS[b.type],v=b.val;if(d.hat)continue;
   switch(b.type){
    case'mbIcon':out.push(I+'display.show(Image.'+(MBI[num(v)]||MBI[0]).py+')');break;
    case'mbNum':out.push(I+'display.scroll('+Math.round(num(v))+')');break;
    case'mbClear':out.push(I+'display.clear()');break;
    case'mbNote':case'note':out.push(I+`music.play('${NOTE[Math.max(1,Math.min(8,Math.round(num(v))))-1]}:4')`);break;
    case'say':out.push(I+'display.scroll('+JSON.stringify(String(v??'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[¡¿]/g,'').replace(/[^\x20-\x7e]/g,''))+')');break;
    case'wait':out.push(I+'sleep('+Math.round(Math.max(0,num(v))*100)+')');break;
    case'pop':out.push(I+'music.pitch(880, 80)');break;
    case'drum':out.push(I+'music.pitch(110, 150)');break;
    case'bell':out.push(I+'music.play(music.BA_DING)');break;
    case'repeat':{out.push(I+'for i in range('+Math.max(0,Math.floor(num(v)))+'):');const inner=conv(b.inner||[],ind+4);out.push(...(inner.some(l=>!l.trim().startsWith('#'))?inner:[...inner,' '.repeat(ind+4)+'pass']));break}
    case'end':case'forever':break;
    default:out.push(I+'# '+d.name.replace(/\s*\(.*\)\s*$/,'')+' (solo funciona en el escenario)');
   }
  }
  return out;
 };
 const lines=['# Programa hecho con Bloquitos','from microbit import *','import music',''];
 const start=[],loop=[],onA=[],onB=[];let k=0;
 P.pages.forEach(p=>p.sprites.forEach(sp=>sp.scripts.forEach(sc=>{
  const f=sc.blocks[0];if(!f)return;
  const kind={flag:'start',mbA:'a',mbB:'b'}[f.type];if(!kind)return;
  const body=conv(sc.blocks,4);if(!body.some(l=>!l.trim().startsWith('#')))return;
  const forever=sc.blocks[sc.blocks.length-1].type==='forever';
  const name={start:'al_empezar',a:'al_presionar_a',b:'al_presionar_b'}[kind]+'_'+(++k);
  lines.push('# '+sp.name,'def '+name+'():',...body,'');
  (kind==='start'?(forever?loop:start):kind==='a'?onA:onB).push(name);
 })));
 if(!k){openModal('Nada para la micro:bit todavía','<p style="margin:0;font-weight:600">Armá un programa que empiece con la bandera verde o con el botón A o B y que use bloques de micro:bit (o de sonido, esperar, decir o repetir). Después volvé a tocar “Descargar .py”.</p>');return}
 start.forEach(n=>lines.push(n+'()'));
 lines.push('','while True:');
 loop.forEach(n=>lines.push('    '+n+'()'));
 onA.forEach(n=>lines.push('    if button_a.was_pressed():','        '+n+'()'));
 onB.forEach(n=>lines.push('    if button_b.was_pressed():','        '+n+'()'));
 lines.push('    sleep(20)');
 download(lines.join('\n')+'\n',fileBase()+'-microbit.py','text/x-python');
 openModal('Programa descargado ✔',`<p style="margin:0;font-weight:600">Se descargó <b>${esc(fileBase())}-microbit.py</b>. Para pasarlo a la micro:bit:</p><ol class="steps"><li>Abrí <a class="lnk" href="https://python.microbit.org/" target="_blank" rel="noopener" title="Abrir el editor de Python de micro:bit en una pestaña nueva">python.microbit.org ↗</a>.</li><li>Tocá <b>Abrir…</b> y elegí el archivo descargado.</li><li>Conectá la micro:bit por USB y tocá <b>Enviar a micro:bit</b>, o tocá <b>Guardar</b> para obtener el archivo <b>.hex</b> y arrastrarlo a la micro:bit.</li></ol>`);
}
$('#mbExport').onclick=exportPy;

/* ---------- Guardar y abrir proyectos ---------- */
const fileBase=()=>(P.name||'mi-proyecto').trim().replace(/[\\/:*?"<>|]+/g,'').replace(/\s+/g,'-')||'mi-proyecto';
function openSave(){
 openModal('Guardar proyecto','<div class="ptools"><input type="text" id="svName" maxlength="40" placeholder="Nombre del proyecto"></div><p style="margin:10px 0 0;font-weight:600;font-size:14px">Se descarga un archivo <b>.bloquitos</b> con todas las páginas, personajes, dibujos y sonidos. Lo podés abrir después con el botón 📂 Abrir, en esta u otra computadora.</p><div class="actions"><button id="svNo">Cancelar</button><button class="primary" id="svOk" style="background:var(--teal)">Guardar</button></div>');
 const inp=$('#svName');inp.value=P.name||'';setTimeout(()=>inp.focus(),50);
 const go=()=>{P.name=inp.value.trim()||'mi-proyecto';save();download(JSON.stringify({app:'bloquitos',version:1,project:P}),fileBase()+'.bloquitos','application/json');closeModal();if(READER.on)READER.say('Proyecto guardado')};
 $('#svOk').onclick=go;$('#svNo').onclick=closeModal;inp.onkeydown=e=>{if(e.key==='Enter')go()};
}
$('#btnSave').onclick=openSave;
$('#btnOpen').onclick=()=>$('#fileIn').click();
$('#fileIn').onchange=e=>{
 const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
 const fr=new FileReader();
 fr.onload=()=>{
  try{
   const data=JSON.parse(fr.result),proj=data&&data.project?data.project:data;
   if(!proj||!(Array.isArray(proj.pages)||Array.isArray(proj.sprites)))throw new Error('formato');
   stopAll();P=proj;normalize();goPage(P.pi);updateMB();
   if(READER.on)READER.say('Proyecto abierto');
  }catch(err){openModal('No se pudo abrir','<p style="margin:0;font-weight:600">Ese archivo no parece un proyecto de Bloquitos. Elegí un archivo que termine en <b>.bloquitos</b>.</p>')}
 };
 fr.readAsText(f);
};
